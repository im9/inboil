name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default; only the release job (which runs no dependency code)
# gets write access.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build app
        run: pnpm build

      - name: Build site
        run: cd site && pnpm build

      - name: Deploy app
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm exec wrangler pages deploy dist --project-name=inboil
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cd site && pnpm exec wrangler pages deploy dist --project-name=inboil-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  release:
    needs: check
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Auto-tag release
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          # Extract changelog section for this version
          NOTES=$(sed -n "/^## \[${VERSION#v}\]/,/^## \[/{ /^## \[${VERSION#v}\]/d; /^## \[/d; p; }" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "No changelog section found for ${VERSION}, using auto-generated notes"
            gh release create "${VERSION}" --target main --title "${VERSION}" --generate-notes
          else
            echo "$NOTES" | gh release create "${VERSION}" --target main --title "${VERSION}" --notes-file -
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>inboil v1 — Mobile Pattern Detail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="mockups.css">
  <style>
    .pat-sheet {
      max-height: 540px;
    }
    .sheet-tabs {
      display: flex;
      padding: 0 12px;
      gap: 4px;
      border-bottom: 1px solid var(--lz-divider);
    }
    .sheet-tab {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: transparent;
      font-family: var(--font-data);
      font-size: var(--fs-sm);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--lz-text-hint);
      border-bottom: 2px solid transparent;
    }
    .sheet-tab.active {
      color: var(--lz-text-bright);
      border-bottom-color: var(--color-olive);
    }

    /* Step row — 16 steps in 4 groups of 4 */
    .step-row {
      padding: 16px 12px 12px;
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      gap: 2px;
    }
    .step {
      aspect-ratio: 1;
      border: 1px solid var(--lz-text-hint);
      background: var(--color-bg);
      border-radius: 0;
      position: relative;
    }
    .step.on {
      background: var(--color-olive);
      border-color: var(--color-olive);
    }
    .step.playing {
      background: var(--color-blue);
      border-color: var(--color-blue);
      animation: cell-pulse var(--beat) ease-in-out infinite alternate;
    }
    /* Visual group spacing on every 4th step */
    .step:nth-child(4n) { margin-right: 4px; }
    .step:last-child { margin-right: 0; }

    /* Velocity row below */
    .vel-row {
      padding: 0 12px 12px;
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      gap: 2px;
      height: 40px;
      align-items: flex-end;
    }
    .vel-bar {
      background: var(--olive-bg);
      border-radius: 0;
      min-height: 4px;
    }
    .vel-bar.high { background: var(--olive-border-strong); height: 90%; }
    .vel-bar.mid  { background: var(--olive-border); height: 65%; }
    .vel-bar.low  { background: var(--olive-bg); height: 35%; }
    .vel-bar.off  { background: var(--lz-bg-active); height: 12%; }
    .vel-row .vel-bar:nth-child(4n) { margin-right: 4px; }
    .vel-row .vel-bar:last-child { margin-right: 0; }

    /* Sheet footer — routing info */
    .pat-routing {
      padding: 8px 16px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px solid var(--lz-divider);
      font-size: var(--fs-sm);
      letter-spacing: 0.06em;
      color: var(--lz-text-mid);
      text-transform: uppercase;
    }
    .pat-routing strong {
      color: var(--lz-text-bright);
      font-weight: 700;
    }
    .pat-routing .arrow {
      color: var(--lz-text-hint);
    }
  </style>
</head>
<body>
  <div class="device">
    <header class="m-header">
      <div class="h-title">SCENE 1<span class="chevron">▾</span></div>
      <div class="h-bpm">
        <span class="h-bpm-val">120</span>
        <span class="h-bpm-label">BPM</span>
      </div>
      <div class="h-transport">
        <button class="btn-t playing">▶</button>
        <button class="btn-t">■</button>
        <button class="btn-rec">●</button>
      </div>
      <button class="btn-menu">⋯</button>
    </header>

    <div class="m-canvas">
      <svg class="edges" viewBox="0 0 390 788" preserveAspectRatio="none" style="opacity: 0.4;">
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 0, 8 4, 0 8" fill="currentColor"/>
          </marker>
        </defs>
        <line x1="108" y1="60" x2="276" y2="60" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
        <line x1="108" y1="160" x2="276" y2="160" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
      </svg>

      <!-- DRUM PAT is selected (the tile user tapped) -->
      <div class="node pattern selected" style="left: 12px; top: 16px;">
        <div class="name">DRUM<span class="badge">PAT</span></div>
        <div class="grid">
          <div class="cell on"></div><div class="cell"></div><div class="cell"></div><div class="cell on"></div>
          <div class="cell"></div><div class="cell on"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell on"></div><div class="cell"></div><div class="cell playing"></div><div class="cell"></div>
          <div class="cell on"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        </div>
      </div>
      <div class="node instrument kick dim" style="left: 282px; top: 16px;">
        <div class="name">KICK<span class="badge">DRUM</span></div>
        <div class="vu"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        <div class="meta"><span>VOL .78</span><span>C2</span></div>
      </div>
      <div class="node pattern dim" style="left: 12px; top: 116px;">
        <div class="name">BASS<span class="badge">PAT</span></div>
        <div class="grid">
          <div class="cell on"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell on"></div><div class="cell"></div><div class="cell on"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell on"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell on"></div><div class="cell"></div><div class="cell on"></div><div class="cell"></div>
        </div>
      </div>
      <div class="node instrument bass dim" style="left: 282px; top: 116px;">
        <div class="name">BASS<span class="badge">303</span></div>
        <div class="vu"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        <div class="meta"><span>VOL .62</span><span>A1</span></div>
      </div>

      <div class="backdrop"></div>

      <!-- Pattern detail sheet -->
      <div class="sheet pat-sheet">
        <div class="handle"></div>
        <div class="sheet-title">
          <span>DRUM PAT</span>
          <span class="sub">16 steps</span>
        </div>
        <div class="sheet-tabs">
          <button class="sheet-tab active">STEP</button>
          <button class="sheet-tab">VEL</button>
          <button class="sheet-tab">CHNC</button>
        </div>

        <!-- 16-step row -->
        <div class="step-row">
          <div class="step on"></div>
          <div class="step"></div>
          <div class="step"></div>
          <div class="step on"></div>
          <div class="step"></div>
          <div class="step on"></div>
          <div class="step"></div>
          <div class="step"></div>
          <div class="step on"></div>
          <div class="step"></div>
          <div class="step playing"></div>
          <div class="step"></div>
          <div class="step on"></div>
          <div class="step"></div>
          <div class="step"></div>
          <div class="step"></div>
        </div>

        <!-- Velocity bars -->
        <div class="vel-row">
          <div class="vel-bar high"></div>
          <div class="vel-bar off"></div>
          <div class="vel-bar off"></div>
          <div class="vel-bar mid"></div>
          <div class="vel-bar off"></div>
          <div class="vel-bar low"></div>
          <div class="vel-bar off"></div>
          <div class="vel-bar off"></div>
          <div class="vel-bar high"></div>
          <div class="vel-bar off"></div>
          <div class="vel-bar mid"></div>
          <div class="vel-bar off"></div>
          <div class="vel-bar high"></div>
          <div class="vel-bar off"></div>
          <div class="vel-bar off"></div>
          <div class="vel-bar off"></div>
        </div>

        <!-- Routing info -->
        <div class="pat-routing">
          <span>ROUTES TO</span>
          <span class="arrow">→</span>
          <strong>KICK</strong>
        </div>
      </div>
    </div>
  </div>

  <div class="label">v1 / mockups / mobile-pattern-detail.html — pattern tile tapped, step sheet open</div>
</body>
</html>

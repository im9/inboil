<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>inboil v1 — Mobile Palette Open</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="mockups.css">
  <style>
    /* Palette sheet — appears from bottom on `+` tap */
    .palette-sheet {
      max-height: 480px;
    }
    .palette-list {
      padding: 8px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .palette-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 8px;
      border: none;
      background: transparent;
      text-align: left;
      color: var(--lz-text-bright);
      border-bottom: 1px solid var(--lz-divider);
      font-family: var(--font-data);
    }
    .palette-item:last-child {
      border-bottom: none;
    }
    .palette-icon {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      border: 1px solid var(--lz-border-strong);
      background: var(--color-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--fs-sm);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--lz-text-strong);
    }
    .palette-icon.gen-turing    { border-color: var(--tool-turing);    color: var(--tool-turing); }
    .palette-icon.gen-tonnetz   { border-color: var(--tool-tonnetz);   color: var(--tool-tonnetz); }
    .palette-icon.gen-quantizer { border-color: var(--tool-quantizer); color: var(--tool-quantizer); }
    .palette-icon.gen-sweep     { border-color: var(--tool-sweep);     color: var(--tool-sweep); }
    .palette-icon.instrument {
      background: var(--color-surface);
      color: var(--color-fg);
    }
    .palette-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .palette-name {
      font-size: var(--fs-lg);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .palette-desc {
      font-size: var(--fs-sm);
      color: var(--lz-text-mid);
      letter-spacing: 0.02em;
    }
    .palette-more {
      font-size: var(--fs-min);
      color: var(--lz-text-hint);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* + button pressed/active state */
    .add-btn.active {
      background: var(--color-olive);
      color: var(--color-bg);
    }
  </style>
</head>
<body>
  <div class="device">
    <header class="m-header">
      <div class="h-title">SCENE 1<span class="chevron">▾</span></div>
      <div class="h-bpm">
        <span class="h-bpm-val">120</span>
        <span class="h-bpm-label">BPM</span>
      </div>
      <div class="h-transport">
        <button class="btn-t playing">▶</button>
        <button class="btn-t">■</button>
        <button class="btn-rec">●</button>
      </div>
      <button class="btn-menu">⋯</button>
    </header>

    <div class="m-canvas">
      <!-- Dimmed canvas content (same nodes as primary, but de-emphasized) -->
      <svg class="edges" viewBox="0 0 390 788" preserveAspectRatio="none" style="opacity: 0.3;">
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 0, 8 4, 0 8" fill="currentColor"/>
          </marker>
        </defs>
        <line x1="108" y1="60"  x2="276" y2="60"  stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
        <line x1="108" y1="160" x2="276" y2="160" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
        <line x1="108" y1="260" x2="276" y2="260" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
      </svg>

      <div class="node pattern dim" style="left: 12px; top: 16px;">
        <div class="name">DRUM<span class="badge">PAT</span></div>
        <div class="grid">
          <div class="cell on"></div><div class="cell"></div><div class="cell"></div><div class="cell on"></div>
          <div class="cell"></div><div class="cell on"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell on"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell on"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        </div>
      </div>
      <div class="node instrument kick dim" style="left: 282px; top: 16px;">
        <div class="name">KICK<span class="badge">DRUM</span></div>
        <div class="vu"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        <div class="meta"><span>VOL .78</span><span>C2</span></div>
      </div>
      <div class="node pattern dim" style="left: 12px; top: 116px;">
        <div class="name">BASS<span class="badge">PAT</span></div>
        <div class="grid">
          <div class="cell on"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell on"></div><div class="cell"></div><div class="cell on"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell on"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell on"></div><div class="cell"></div><div class="cell on"></div><div class="cell"></div>
        </div>
      </div>
      <div class="node instrument bass dim" style="left: 282px; top: 116px;">
        <div class="name">BASS<span class="badge">303</span></div>
        <div class="vu"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        <div class="meta"><span>VOL .62</span><span>A1</span></div>
      </div>
      <div class="node pattern dim" style="left: 12px; top: 216px;">
        <div class="name">LEAD<span class="badge">PAT</span></div>
        <div class="grid">
          <div class="cell"></div><div class="cell on"></div><div class="cell"></div><div class="cell on"></div>
          <div class="cell on"></div><div class="cell"></div><div class="cell on"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell on"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell on"></div><div class="cell"></div><div class="cell"></div><div class="cell on"></div>
        </div>
      </div>
      <div class="node instrument lead dim" style="left: 282px; top: 216px;">
        <div class="name">LEAD<span class="badge">WT</span></div>
        <div class="vu"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        <div class="meta"><span>VOL .54</span><span>E4</span></div>
      </div>

      <!-- Backdrop -->
      <div class="backdrop"></div>

      <!-- + button in active (pressed) state -->
      <button class="add-btn active" title="adding node">+</button>

      <!-- Palette sheet (rises from bottom) -->
      <div class="sheet palette-sheet">
        <div class="handle"></div>
        <div class="sheet-title">
          <span>ADD NODE</span>
          <span class="sub">tap to add</span>
        </div>
        <div class="palette-list">
          <button class="palette-item">
            <div class="palette-icon">▦</div>
            <div class="palette-body">
              <div class="palette-name">Pattern</div>
              <div class="palette-desc">Step sequencer — hand-author trigs</div>
            </div>
          </button>
          <button class="palette-item">
            <div class="palette-icon instrument">♫</div>
            <div class="palette-body">
              <div class="palette-name">Instrument</div>
              <div class="palette-desc">Voice + voice params, plays incoming sources</div>
            </div>
          </button>
          <button class="palette-item">
            <div class="palette-icon gen-turing">◆</div>
            <div class="palette-body">
              <div class="palette-name">Drift</div>
              <div class="palette-desc">Shift-register walk — looping variation</div>
            </div>
          </button>
          <button class="palette-item">
            <div class="palette-icon gen-tonnetz">◇</div>
            <div class="palette-body">
              <div class="palette-name">Cascade</div>
              <div class="palette-desc">Smooth chord progression through related keys</div>
            </div>
          </button>
          <button class="palette-item">
            <div class="palette-icon gen-quantizer">▢</div>
            <div class="palette-body">
              <div class="palette-name">Snap</div>
              <div class="palette-desc">Scale-lock incoming notes</div>
            </div>
          </button>
          <button class="palette-item">
            <div class="palette-icon gen-sweep">◢</div>
            <div class="palette-body">
              <div class="palette-name">Sweep</div>
              <div class="palette-desc">Continuous parameter automation</div>
            </div>
          </button>
          <button class="palette-item">
            <div class="palette-icon" style="border: none; background: transparent; color: var(--lz-text-hint);">⋯</div>
            <div class="palette-body">
              <div class="palette-more">More node types</div>
            </div>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="label">v1 / mockups / mobile-palette-open.html — `+` tapped, add-node palette open</div>
</body>
</html>

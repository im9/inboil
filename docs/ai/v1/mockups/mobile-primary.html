<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>inboil v1 — Mobile Primary Surface</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="mockups.css">
</head>
<body>
  <div class="device">
    <header class="m-header">
      <div class="h-title">SCENE 1<span class="chevron">▾</span></div>
      <div class="h-bpm">
        <span class="h-bpm-val">120</span>
        <span class="h-bpm-label">BPM</span>
      </div>
      <div class="h-transport">
        <button class="btn-t playing" title="play">▶</button>
        <button class="btn-t" title="stop">■</button>
        <button class="btn-rec" title="record">●</button>
      </div>
      <button class="btn-menu" title="menu">⋯</button>
    </header>

    <div class="m-canvas">
      <svg class="edges" viewBox="0 0 390 788" preserveAspectRatio="none">
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 0, 8 4, 0 8" fill="currentColor"/>
          </marker>
          <marker id="arrow-gen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
            <polygon points="0 0, 8 4, 0 8" fill="var(--tool-turing)"/>
          </marker>
        </defs>
        <line x1="108" y1="60"  x2="276" y2="60"  stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
        <line x1="108" y1="160" x2="276" y2="160" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
        <line x1="108" y1="260" x2="276" y2="260" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
        <path d="M 108,360 C 200,360 270,360 276,278"
              fill="none" stroke="var(--tool-turing)" stroke-width="1.5"
              marker-end="url(#arrow-gen)"/>
      </svg>

      <!-- Row 1: DRUM → KICK -->
      <div class="node pattern" style="left: 12px; top: 16px;">
        <div class="name">DRUM<span class="badge">PAT</span></div>
        <div class="grid">
          <div class="cell on"></div><div class="cell"></div><div class="cell"></div><div class="cell on"></div>
          <div class="cell"></div><div class="cell on"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell on"></div><div class="cell"></div><div class="cell playing"></div><div class="cell"></div>
          <div class="cell on"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        </div>
      </div>
      <div class="node instrument kick" style="left: 282px; top: 16px;">
        <div class="name">KICK<span class="badge">DRUM</span></div>
        <div class="vu">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <div class="meta"><span>VOL .78</span><span>C2</span></div>
      </div>

      <!-- Row 2: BASS → BASS -->
      <div class="node pattern" style="left: 12px; top: 116px;">
        <div class="name">BASS<span class="badge">PAT</span></div>
        <div class="grid">
          <div class="cell on"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell on"></div><div class="cell"></div><div class="cell on"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell on"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell on"></div><div class="cell"></div><div class="cell on"></div><div class="cell"></div>
        </div>
      </div>
      <div class="node instrument bass" style="left: 282px; top: 116px;">
        <div class="name">BASS<span class="badge">303</span></div>
        <div class="vu">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <div class="meta"><span>VOL .62</span><span>A1</span></div>
      </div>

      <!-- Row 3: LEAD → LEAD -->
      <div class="node pattern" style="left: 12px; top: 216px;">
        <div class="name">LEAD<span class="badge">PAT</span></div>
        <div class="grid">
          <div class="cell"></div><div class="cell on"></div><div class="cell"></div><div class="cell on"></div>
          <div class="cell on"></div><div class="cell"></div><div class="cell on"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell on"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell on"></div><div class="cell"></div><div class="cell"></div><div class="cell on"></div>
        </div>
      </div>
      <div class="node instrument lead" style="left: 282px; top: 216px;">
        <div class="name">LEAD<span class="badge">WT</span></div>
        <div class="vu">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <div class="meta"><span>VOL .54</span><span>E4</span></div>
      </div>

      <!-- Row 4: DRIFT → LEAD (generative direct, v1 novelty) -->
      <div class="node generative" style="left: 12px; top: 316px;">
        <div class="name">DRIFT<span class="badge">TM</span></div>
        <div class="bits">
          <div class="bit on"></div><div class="bit"></div>
          <div class="bit on current"></div><div class="bit on"></div>
          <div class="bit"></div><div class="bit on"></div>
          <div class="bit"></div><div class="bit on"></div>
        </div>
        <div class="meta"><span>LEN 8</span><span>LOCK .60</span></div>
      </div>

      <button class="add-btn" title="add node">+</button>
    </div>
  </div>

  <div class="label">v1 / mockups / mobile-primary.html — scene-centric primary surface</div>
</body>
</html>
